<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>薛大廚 Hsueh Food</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Nunito:wght@400;600;700&display=swap">
<style>
/* VOICE: 安靜、可愛、少字，像一本會發光的私人食譜本
   IDEA: 夜空廚房的手帳：每天一頁，四格餐點
   PICTURE: 工具本身就是畫面——週曆條 + 照片縮圖列 / 食譜卡格
   COLOUR and TYPE: Pensieve 夜空藍；粉圓體 + Nunito 數字；朱紅只給「新增」
   LAYOUT: 單欄 720px，上方品牌與切換，手機上表單變底部抽屜 */
:root{color-scheme:dark;
--bg:#14233a;--bg2:#1a2d49;--panel:#1c3150;--chip:#28426b;--rim:#2f4d76;--ink:#f6e7c8;--sub:#a9b3c2;--acc:#e8553a;--acc2:#f2b84b;--comp:#f6e7c8;--ctext:#14233a;
--font-sans:"Huninn","PingFang TC","Microsoft JhengHei",sans-serif;--font-latin:"Nunito","Huninn",sans-serif;
--radius-pill:999px;--radius-sm:14px;--radius-xl:28px;--radius-2xl:30px;
--shadow-float:0 14px 36px -10px rgba(4,10,22,.65);
--spring:cubic-bezier(.34,1.4,.5,1);--ease:cubic-bezier(.22,.8,.2,1)}
*{box-sizing:border-box;min-width:0}
html,body{min-height:100%}
body{margin:0;font:16px/1.55 var(--font-sans);background:radial-gradient(60% 45% at 85% 0%,#2a3f6b 0,transparent 70%),radial-gradient(50% 40% at 0% 100%,#3a2a4d 0,transparent 70%),linear-gradient(var(--bg),var(--bg2));background-attachment:fixed;color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:clip}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
#sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--ink);opacity:.5}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
svg{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.latin{font-family:var(--font-latin)}
.sp{flex:1}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:18px max(16px,4vw) 60px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font:700 20px var(--font-latin);letter-spacing:.01em}
.brand small{font-size:13px;color:var(--sub);display:inline-flex;align-items:center;gap:6px}
.brand small::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc2)}
.vtog{display:inline-flex;padding:3px;border-radius:var(--radius-pill);background:var(--chip)}
.vtog button{height:32px;padding:0 14px;border-radius:var(--radius-pill);font-size:14px;color:var(--sub);transition:background .25s,color .25s}
.vtog button.on{background:var(--acc2);color:var(--ctext)}
.hb{position:relative;width:40px;height:40px;border-radius:var(--radius-sm);display:inline-grid;place-items:center;background:var(--acc);color:var(--comp);flex:none;transition:transform .3s var(--spring)}
.hb::after{content:"";position:absolute;inset:4px 4px 50% 4px;border-radius:10px;background:rgba(246,231,200,.08)}
.hb:hover{transform:translateY(-2px)}.hb:active{transform:scale(.9)}
.hb svg{width:20px;height:20px;stroke-width:1.8}
.btn{height:40px;padding:0 18px;border-radius:var(--radius-pill);background:var(--chip);font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap;transition:transform .3s var(--spring),filter .2s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:active{transform:scale(.94)}
.btn.pri{background:var(--acc);color:var(--comp);font-weight:700}
.btn.ghost{background:transparent;color:var(--sub)}
.btn.danger{background:transparent;color:var(--acc)}
.btn.sm{height:32px;padding:0 13px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.ib{width:34px;height:30px;border-radius:var(--radius-pill);background:var(--chip);display:inline-grid;place-items:center;flex:none;color:var(--ink);transition:transform .3s var(--spring)}
.ib:hover{transform:translateY(-2px)}.ib:active{transform:scale(.88)}
.ib svg{width:15px;height:15px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--radius-pill);font-size:12px;background:rgba(242,184,75,.2);color:var(--acc2);white-space:nowrap;flex:none}
.panel{background:var(--panel);border-radius:var(--radius-xl);box-shadow:inset 0 0 0 1px var(--rim),var(--shadow-float)}
/* 週曆 */
.week{display:flex;align-items:center;gap:4px;padding:6px;border-radius:22px}
.days{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 0 3px;border-radius:13px;line-height:1.3;color:var(--sub);position:relative;transition:background .25s,transform .3s var(--spring)}
.day small{font-size:10.5px}
.day b{font:700 14px var(--font-latin);color:var(--ink)}
.day .dt{width:5px;height:5px;border-radius:50%;background:transparent}
.day .dt.y{background:var(--acc2)}
.day.td{box-shadow:inset 0 0 0 1.5px var(--rim)}
.day.on{background:var(--acc2);color:var(--ctext)}
.day.on b{color:var(--ctext)}.day.on .dt.y{background:var(--ctext)}
.week .ib{width:28px;height:34px}
.dh{display:flex;align-items:center;gap:8px;margin:12px 4px 8px}
.dh .big{font:700 18px var(--font-latin)}
.dh .sub{color:var(--sub);font-size:13px}
.dpk{position:relative;overflow:hidden}
.dpk input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;color-scheme:dark}
/* 餐點 */
.slots{display:grid;gap:8px}
.slot{padding:6px 8px 8px 14px;border-radius:22px;animation:rise .4s var(--ease) both}
.slot:nth-child(2){animation-delay:.04s}.slot:nth-child(3){animation-delay:.08s}.slot:nth-child(4){animation-delay:.12s}
.sl{display:flex;align-items:center;gap:8px;min-height:30px;font-size:13px;color:var(--sub)}
.sl .ib{width:30px;height:26px;background:transparent;box-shadow:inset 0 0 0 1px var(--rim)}
.list{display:flex;flex-direction:column;gap:6px}
.list:not(:empty){margin-top:4px}
.row{display:flex;align-items:center;gap:10px;padding:5px 8px 5px 5px;border-radius:15px;background:var(--chip);transition:transform .3s var(--spring),filter .2s}
.row:hover{transform:translateX(3px);filter:brightness(1.08)}
.th{width:42px;height:42px;border-radius:11px;flex:none;overflow:hidden;background:var(--panel);display:grid;place-items:center;color:var(--rim)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th svg{width:18px;height:18px}
.rb{flex:1;display:flex;align-items:center;gap:8px;text-align:left;min-height:42px}
.rb .tx{flex:1;display:flex;flex-direction:column}
.rb .t .q{color:var(--sub);font-size:13px}
.rb .t{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb .n{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 食譜 */
.search{display:flex;align-items:center;gap:6px;height:42px;padding:0 8px 0 16px;border-radius:var(--radius-pill);background:var(--comp);color:var(--ctext);box-shadow:var(--shadow-float)}
.search svg{width:18px;height:18px;opacity:.6;flex:none}
.search input{flex:1;border:0;outline:none;background:transparent;font:inherit;font-size:16px;color:var(--ctext)}
.search input::placeholder{color:rgba(20,35,58,.5)}
.segs{display:flex;gap:6px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.seg{height:30px;padding:0 13px;border-radius:var(--radius-pill);font-size:13px;background:var(--panel);color:var(--sub);white-space:nowrap;flex:none;transition:background .25s,color .25s}
.seg.on{background:var(--acc2);color:var(--ctext)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.rc{display:flex;flex-direction:column;text-align:left;overflow:hidden;border-radius:22px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--rim);transition:transform .3s var(--spring);animation:rise .4s var(--ease) both}
.rc:hover{transform:translateY(-3px)}
.rc .ph{aspect-ratio:4/3;background:var(--chip);display:grid;place-items:center;color:var(--rim)}
.rc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.rc .ph svg{width:34px;height:34px}
.rc .nm{padding:8px 11px 0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc .mt{padding:2px 12px 11px;font:600 12px var(--font-latin);color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:48px 0;font-size:15px}
/* 城市街角 */
.city{margin:8px auto 0;max-width:680px}
.city svg{max-height:calc(100vh - 230px);max-height:calc(100dvh - 230px)}
.city svg{display:block;width:100%;height:auto;overflow:visible;stroke:none;fill:none}
.tday{margin-top:10px}
@media(max-width:600px){.city{margin:4px -6px 0}.city.band svg{max-height:none}.top{flex-wrap:nowrap;gap:6px}.hb2,.top .hb{width:36px;height:36px}.vtog button{padding:0 11px;height:30px}}
.bld{cursor:pointer;transition:transform .4s var(--spring),filter .3s}
.bld:hover{transform:translateY(-4px)}
.bld .win{fill:var(--acc2)}.bld .ic{fill:none;stroke:var(--ctext);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bld .uw{fill:#14233a}.bld .uw.l{fill:var(--acc2);opacity:.55}
.bld .win{filter:drop-shadow(0 0 4px rgba(242,184,75,.8))}
.bld.on{transform:translateY(-6px);filter:drop-shadow(0 0 14px rgba(242,184,75,.5))}
.sgn{cursor:pointer}
.sgn .pl{stroke:#5b7aa6;stroke-width:2.5;stroke-linecap:round}
.sgn .sb{fill:var(--comp);filter:drop-shadow(0 4px 6px rgba(4,10,22,.45))}
.sgn .dk{fill:var(--acc)}
.sgn .ic{fill:none;stroke:var(--comp);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sgn .cn{fill:var(--ctext);font-family:var(--font-sans)}
.sgn .en{fill:#5e6b80;font-family:var(--font-latin);font-weight:700;letter-spacing:.03em}
.sgn .cb{fill:var(--acc2);stroke:var(--comp);stroke-width:2}.sgn .cbt{fill:var(--ctext);font-family:var(--font-latin);font-weight:700}
.sgn .bob{animation:bob 2.6s ease-in-out infinite alternate}
.sgn:hover .bob{animation-play-state:paused;transform:translateY(-4px);transition:transform .3s var(--spring)}
@keyframes bob{to{transform:translateY(-3px)}}
.bld.in{animation:drop .75s var(--spring) backwards}
@keyframes drop{from{transform:translateY(-40px);opacity:0}}
.bld:active,.sgn:active{transform:scale(.97)}
.bld .uw.l:nth-of-type(3n){animation:tw 3.2s ease-in-out infinite alternate}
.bld .uw.l:nth-of-type(4n+1){animation:tw 4.6s ease-in-out 1s infinite alternate}
@keyframes tw{to{opacity:.15}}
.puff circle{fill:var(--ink);opacity:0;transform-box:fill-box;transform-origin:center;animation:puff 3.4s ease-out infinite}
@keyframes puff{0%{transform:translateY(0) scale(.5);opacity:0}25%{opacity:.35}100%{transform:translateY(-22px) scale(1.4);opacity:0}}
.hint{text-align:center;color:var(--sub);font-size:13px;margin-top:2px}
/* 搜尋鈕、今日列、月曆、時段 */
.hb2{width:40px;height:40px;border-radius:var(--radius-sm);display:inline-grid;place-items:center;background:var(--panel);box-shadow:inset 0 0 0 1px var(--rim);flex:none;transition:transform .3s var(--spring)}
.hb2:hover{transform:translateY(-2px)}.hb2 svg{width:18px;height:18px}
.search.ins{flex:1;height:44px;box-shadow:none}
.city .gnd{fill:#172a45}.city .walk{fill:var(--rim)}.city .dash{stroke:var(--ink);stroke-opacity:.22;stroke-width:.025;stroke-dasharray:.12 .12;fill:none}.city .lamp{fill:var(--acc2);opacity:.08}
.city .tree{fill:#3d7468}.city .tree2{fill:#5a9585}
.ppl{animation:ppl 1.6s ease-in-out infinite alternate}
@keyframes ppl{to{transform:translateY(-1.5px)}}
.puff.big circle{animation-duration:2.6s}
.bulb{animation:tw 1.8s ease-in-out infinite alternate}
.tday{display:flex;align-items:center;gap:8px;max-width:560px;margin:14px auto 0;padding:6px 8px 6px 6px;border-radius:var(--radius-pill)}
.tdb{flex:1;display:flex;align-items:center;gap:10px;text-align:left;min-height:44px;padding-left:12px}
.tdd{display:flex;flex-direction:column;line-height:1.25;flex:none}.tdd b{font-weight:400;font-size:14px}.tdd small{font:600 11.5px var(--font-latin);color:var(--sub)}
.tts{display:flex;flex:none}.tt{width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--chip);box-shadow:0 0 0 2px var(--panel);display:grid;place-items:center;margin-left:-8px}
.tt:first-child{margin-left:0}.tt img{width:100%;height:100%;object-fit:cover}.tt i{font-style:normal;font-size:12px;color:var(--acc2)}
.tdn{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tdn.sub{color:var(--sub)}
.tday .add{width:40px;height:40px;background:var(--acc2);color:var(--ctext)}
.todp{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:16px;font-size:12px;color:var(--sub)}
.vtog.mini{padding:2px}.vtog.mini button{height:26px;padding:0 11px;font-size:12.5px}
.mh{display:flex;align-items:center;gap:8px;margin:2px 4px 10px}.mh .big{font:700 18px var(--font-latin)}
.mg{padding:10px;border-radius:22px}
.mw,.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.mw span{text-align:center;font-size:11px;color:var(--sub);padding-bottom:4px}
.mc{position:relative;aspect-ratio:1;border-radius:12px;background:rgba(246,231,200,.05);overflow:hidden;transition:transform .3s var(--spring),opacity .3s}
.mgrid.an .mc{animation:rise .4s var(--ease) both}
.mc.hl{box-shadow:inset 0 0 0 3px var(--acc2)}.mc.hl::after{content:"";position:absolute;right:4px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--acc2);box-shadow:0 0 0 2px var(--bg)}
.mc.dim{opacity:.28}
.fq{margin-top:14px;padding:12px 12px 14px;border-radius:22px}
.fqh{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 4px 6px}
.fqr{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) 3.4em;align-items:center;gap:10px;width:100%;min-height:38px;padding:4px 8px;border-radius:12px;text-align:left;font-size:14px;transition:background .2s}
.fqr:hover{background:rgba(246,231,200,.05)}.fqr.on{background:rgba(242,184,75,.16)}
.fqn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fqb{height:8px;border-radius:4px;background:rgba(246,231,200,.08);overflow:hidden}.fqb i{display:block;height:100%;border-radius:4px;background:var(--acc2);transition:width .5s var(--ease)}
.fqc{font:700 12.5px var(--font-latin);color:var(--sub);text-align:right;white-space:nowrap}
.fqd{margin-top:10px;padding:12px;border-radius:16px;background:var(--chip);animation:rise .35s var(--ease) both}
.fqd p{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 10px;font-size:14px}.fqd p b{font:700 15px var(--font-latin);color:var(--acc2)}.fqd p .btn{margin-left:auto}
.dch{display:flex;flex-wrap:wrap;gap:6px}.dch button{height:30px;padding:0 12px;border-radius:var(--radius-pill);background:var(--panel);font:600 12.5px var(--font-latin);transition:transform .3s var(--spring)}.dch button:hover{transform:translateY(-2px)}
.cityh{display:flex;margin-top:2px}
.allb{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px 0 11px;border-radius:var(--radius-pill);background:var(--panel);box-shadow:inset 0 0 0 1px var(--rim);font-size:13.5px;transition:transform .3s var(--spring)}
.allb:hover{transform:translateY(-2px)}.allb svg{width:15px;height:15px}.allb b{font:700 12.5px var(--font-latin);color:var(--acc2)}
.msec{display:flex;align-items:center;gap:8px;margin:16px 2px 8px;font-size:14px}.msec small{font:700 11.5px var(--font-latin);color:var(--sub)}.msec b{font:700 12.5px var(--font-latin);color:var(--sub)}
.msec .md{width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--comp);display:grid;place-items:center;flex:none}.msec .md svg{width:14px;height:14px;stroke-width:1.7}
.mc:hover{transform:scale(1.05);z-index:1}
.mc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mc b{position:absolute;left:5px;top:3px;font:700 11.5px var(--font-latin);color:var(--sub)}
.mc.ph b{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.mc i{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-style:normal;color:var(--acc2);font-size:11px;letter-spacing:1px}
.mc em{position:absolute;right:4px;bottom:3px;font:700 10px var(--font-latin);font-style:normal;background:rgba(20,35,58,.75);color:var(--ink);border-radius:8px;padding:0 5px}
.mc.td{box-shadow:inset 0 0 0 2px var(--acc2)}
.mstat{text-align:center;color:var(--sub);font-size:13px;margin-top:12px}.mstat b{font-family:var(--font-latin);color:var(--ink)}
.toast.act{pointer-events:auto;display:inline-flex;align-items:center;gap:12px;padding:8px 8px 8px 18px}
.toast .ub{height:30px;padding:0 14px;border-radius:var(--radius-pill);background:var(--bg);color:var(--acc2);font-size:13.5px}
#orb{position:fixed;top:70px;right:max(6vw,20px);width:46px;height:46px;border-radius:50%;z-index:0;pointer-events:none;transition:all .8s var(--ease)}
:root[data-tod=night] #orb{background:transparent;box-shadow:-9px 7px 0 0 #f6e7c8;opacity:.85}
:root[data-tod=day] #orb{background:#ffd98a;box-shadow:0 0 40px 12px rgba(255,217,138,.35)}
:root[data-tod=dusk] #orb{top:auto;bottom:-14px;width:120px;height:120px;background:#f0a35a;box-shadow:0 0 90px 40px rgba(240,140,80,.35);opacity:.85}
:root[data-tod=day] body{background:linear-gradient(#4a78ad,#2c5582 45%,#1c3557);background-attachment:fixed}
:root[data-tod=day] #sky{opacity:0}
:root[data-tod=day] .city .gnd{fill:#2a4568}:root[data-tod=day] .city .walk{fill:#4a6a94}
:root[data-tod=day] .bld .uw.l{opacity:.12}:root[data-tod=day] .bld .win{filter:none;fill:#f6e2b0}
:root[data-tod=dusk] body{background:linear-gradient(#1f3358,#3a3a62 45%,#7a4a5c 82%,#a8604c);background-attachment:fixed}
:root[data-tod=dusk] #sky{opacity:.45}
:root[data-tod=dusk] .city .gnd{fill:#25304f}
#sky{transition:opacity .8s}
/* 更多選單、每道菜照片、醬料 */
.pm{position:relative}
.pop{position:absolute;right:0;top:46px;z-index:15;min-width:176px;padding:6px;border-radius:18px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--rim),var(--shadow-float);display:grid;gap:2px;transform-origin:top right;animation:menuIn .32s var(--spring)}
.pop[hidden]{display:none}
.pop button{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:12px;font-size:14.5px;text-align:left;transition:background .2s}
.pop button:hover{background:var(--chip)}.pop svg{width:17px;height:17px;flex:none;color:var(--acc2)}
.pop small{margin-left:auto;font:600 11px var(--font-latin);color:var(--sub)}
@keyframes menuIn{from{opacity:0;transform:scale(.85) translateY(-6px)}}
.ed.dish-ed{--cols:40px minmax(0,1.5fr) minmax(0,1fr) 34px}
.bd .dch button{background:var(--chip)}
.dp{position:relative;width:40px;height:40px;border-radius:12px;overflow:hidden;background:rgba(246,231,200,.06);box-shadow:inset 0 0 0 1px var(--rim);display:grid;place-items:center;color:var(--sub);cursor:pointer}
.dp img{width:100%;height:100%;object-fit:cover}.dp svg{width:18px;height:18px}
.dp input{position:absolute;inset:0;opacity:0;cursor:pointer}
.dp .rmx{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:rgba(20,35,58,.85);display:grid;place-items:center;z-index:2;color:var(--ink)}.dp .rmx svg{width:8px;height:8px}

/* GitHub 擁有者模式 */
const GH=(()=>{const h=location.hostname,seg=location.pathname.split('/').filter(Boolean);return h.endsWith('.github.io')&&seg[0]&&!seg[0].includes('.')?{owner:h.split('.')[0],repo:seg[0],branch:'main'}:{owner:'ywshiue',repo:'hsueh-food',branch:'main'}})();
S.pend={};S.delp=new Set();S.local={};
const TOKKEY='hsueh-food-gh-token';
const getTok=()=>{try{return localStorage.getItem(TOKKEY)||''}catch(e){return ''}};
async function gh(path,opt={}){
 const r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}${path}`,{method:opt.method||'GET',cache:'no-store',headers:{Authorization:'Bearer '+S.tok,Accept:opt.raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:opt.body?JSON.stringify(opt.body):undefined});
 if(!r.ok){const e=new Error('github '+r.status);e.status=r.status;throw e}
 return opt.raw?r.text():r.status===204?null:r.json();
}
function setSync(st,msg){S.sync={st,msg};if(!S.ready)return;const e=$('#st');if(!e)return;
 e.innerHTML=st==='busy'?'<div class="status"><span class="spin"></span>上傳到 GitHub⋯</div>':st==='err'?`<div class="status err">還沒上傳成功：${esc(msg||'')} <button class="btn sm" data-a="ghretry">重試</button></div>`:st==='ok'?'<div class="status">已上傳，大約 1 分鐘後大家看得到</div>':'';
 if(st==='ok'){clearTimeout(S.syncT);S.syncT=setTimeout(()=>{if(S.sync.st==='ok')setSync('')},6000)}}
async function pushNow(){
 const pend={...S.pend},delp=[...S.delp];
 const ref=await gh(`/git/ref/heads/${GH.branch}`),head=ref.object.sha,c=await gh(`/git/commits/${head}`),tree=[];
 for(const [path,b64] of Object.entries(pend)){const bl=await gh('/git/blobs',{method:'POST',body:{content:b64,encoding:'base64'}});tree.push({path,mode:'100644',type:'blob',sha:bl.sha})}
 for(const path of delp)tree.push({path,mode:'100644',type:'blob',sha:null});
 const data=JSON.stringify({app:'Hsueh Food',updatedAt:new Date().toISOString(),items:[...S.items].map(([id,v])=>({id,...v}))},null,1);
 tree.push({path:'data.json',mode:'100644',type:'blob',content:data});
 let t;try{t=await gh('/git/trees',{method:'POST',body:{base_tree:c.tree.sha,tree}})}catch(e){if(e.status===422&&delp.length){delp.forEach(p_=>S.delp.delete(p_));return pushNow()}throw e}
 const nc=await gh('/git/commits',{method:'POST',body:{message:'更新薛大廚資料',tree:t.sha,parents:[head]}});
 await gh(`/git/refs/heads/${GH.branch}`,{method:'PATCH',body:{sha:nc.sha}});
 Object.keys(pend).forEach(k=>delete S.pend[k]);delp.forEach(p_=>S.delp.delete(p_));
}
let pushing=null,again=false;
function schedulePush(){
 if(pushing){again=true;return pushing}
 setSync('busy');
 pushing=(async()=>{try{do{again=false;await pushNow()}while(again);setSync('ok')}catch(e){setSync('err',e.status===401?'登入過期，請重新登入':e.status===403||e.status===404?'沒有寫入權限，請重新登入':e.status===409?'GitHub 正在忙，請重試':'網路不穩，請重試')}finally{pushing=null}})();
 return pushing;
}
async function ownerLogin(tok,silent){

 try{const r=await gh('');if(!r.permissions||!r.permissions.push){const e=new Error();e.status=403;throw e}
  const txt=await gh(`/contents/data.json?ref=${GH.branch}`,{raw:true});const j=JSON.parse(txt);
  S.items=new Map((j.items||[]).map(({id,...v})=>[id,v]));S.gh=true;S.ro=false;
  document.documentElement.classList.remove('ro');document.documentElement.classList.add('owner');
  try{localStorage.setItem(TOKKEY,tok)}catch(e){}
  render();return true;
 }catch(e){S.tok='';if(!silent)throw e;return false}
}

/* 照片 */
async function shrink(file,max,q){
 const url=URL.createObjectURL(file);
 try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
  c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',q));
 }finally{URL.revokeObjectURL(url)}
}
const toData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});

 if(S.assets){const b=await shrink(file,800,.72);const a=await S.assets.upload(b);return a.id}
 return toData(await shrink(file,560,.65));
}

function persistLocal(){if(PREVIEW)return;try{localStorage.setItem('hsueh-food',JSON.stringify([...S.items]))}catch(e){toast('裝置空間不夠，照片可能沒存到')}}
async function put(id,obj){
 if(S.gh){S.items.set(id,obj);render();schedulePush();return}
 if(S.col){await S.col.doc(id).set(obj)}else{S.items.set(id,obj);persistLocal();render()}
}
async function drop(id,keep){
 const old=S.items.get(id);
 if(S.gh){S.items.delete(id);render();schedulePush()}
 else if(S.col)await S.col.doc(id).delete();else{S.items.delete(id);persistLocal();render()}
 if(!keep)cleanPhoto(old);
}
function cleanPhoto(old){if(!old)return;const refs=[...new Set([old.photo,...(old.photos||[]),...(old.items||[]).map(d=>d.ph)].filter(Boolean))];let ch=false;
 for(const p_ of refs){if(inUse(p_))continue;
  if(S.gh){if(String(p_).startsWith('photos/')){if(S.pend[p_])delete S.pend[p_];else S.delp.add(p_);ch=true}}
  else if(S.assets&&!String(p_).startsWith('data:'))S.assets.delete(p_).catch(()=>{})}
 if(ch)schedulePush()}

 const nm=old.kind!=='m'?old.name:dishesOf(old).map(x=>x.n).join('、')||'這一餐';
 try{await drop(id,true)}catch(e){toast('沒刪成功，再試一次');return}
 closeOv();render();
 undoToast(`已刪除「${nm}」`,async()=>{try{await put(id,old);render();toast('已復原')}catch(e){toast('沒復原成功')}},()=>cleanPhoto(old));
}

 const f=new FormData($('#fm')),g=k=>String(f.get(k)||'').trim();
